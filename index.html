<!DOCTYPE html>
<html lang="ku" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PurpleScreen — فیلم و زنجیرە و ئەنیمێ بە ژێرنووسی کوردی</title>
<meta name="description" content="PurpleScreen پلاتفۆرمێکی کوردییە بۆ دۆزینەوەی فیلم، زنجیرە و ئەنیمێ بە ژێرنووسی کوردی سۆرانی." />

<meta property="og:title" content="PurpleScreen" />
<meta property="og:description" content="فیلم و زنجیرە و ئەنیمێ بە ژێرنووسی کوردی." />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="canonical" href="#" />

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="site-header" id="siteHeader">
  <div class="header-inner">
    <a href="#/home" class="brand" aria-label="پەڕەی سەرەکی PurpleScreen">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">PurpleScreen</span>
    </a>

    <nav class="main-nav" aria-label="ناڤیگەیشنی سەرەکی">
      <a href="#/home" data-nav="home">سەرەتا</a>
      <a href="#/movies" data-nav="movies">فیلمەکان</a>
      <a href="#/series" data-nav="series">زنجیرەکان</a>
      <a href="#/anime" data-nav="anime">ئەنیمێ</a>
      <a href="#/top250" data-nav="top250">250ـی مێژوو</a>
      <a href="#/reviews" data-nav="reviews">پێداچوونەوە</a>
      <a href="#/requests" data-nav="requests">داواکاری</a>
    </nav>

    <div class="header-actions">
      <button class="icon-btn" id="searchToggle" aria-label="گەڕان" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn only-desktop" id="notifToggle" aria-label="ئاگادارکردنەوەکان" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 3a5 5 0 0 0-5 5v3.2c0 .6-.2 1.1-.6 1.6L5 15h14l-1.4-2.2c-.4-.5-.6-1-.6-1.6V8a5 5 0 0 0-5-5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9.5 18a2.5 2.5 0 0 0 5 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span class="dot" id="notifDot" hidden></span>
      </button>
      <button class="icon-btn only-desktop" id="favToggleHeader" aria-label="دڵخوازەکان">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 20s-7.2-4.5-9.6-9A5.4 5.4 0 0 1 12 6a5.4 5.4 0 0 1 9.6 5c-2.4 4.5-9.6 9-9.6 9Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="themeToggle" aria-label="گۆڕینی ڕووکار">
        <svg viewBox="0 0 24 24" width="20" height="20" id="themeIcon"><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.8"/><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="12" y1="1.5" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22.5"/><line x1="4.2" y1="4.2" x2="6" y2="6"/><line x1="18" y1="18" x2="19.8" y2="19.8"/><line x1="1.5" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22.5" y2="12"/><line x1="4.2" y1="19.8" x2="6" y2="18"/><line x1="18" y1="6" x2="19.8" y2="4.2"/></g></svg>
      </button>
      <button class="avatar-btn only-desktop" id="profileNav" aria-label="پرۆفایل">
        <span class="avatar-circle">پ</span>
      </button>
    </div>
  </div>

  <div class="search-bar" id="searchBar" hidden>
    <div class="search-bar-inner">
      <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input type="search" id="searchInput" placeholder="گەڕان بۆ فیلم، زنجیرە، ئەنیمێ، ئەکتەر..." autocomplete="off" />
      <button class="text-btn" id="searchClose">داخستن</button>
    </div>
  </div>
</header>

<!-- ============ MAIN ============ -->
<main id="app" role="main"></main>

<!-- ============ TEMPLATES (rendered via JS) ============ -->
<template id="tpl-skeleton-card">
  <div class="card skeleton" aria-hidden="true">
    <div class="skel-poster shimmer"></div>
    <div class="skel-line shimmer"></div>
    <div class="skel-line shimmer short"></div>
  </div>
</template>

<!-- ============ MOVIE DETAIL MODAL ============ -->
<div class="modal-overlay" id="detailModal" hidden>
  <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
    <button class="modal-close" id="detailClose" aria-label="داخستن">✕</button>
    <div id="detailContent"></div>
  </div>
</div>

<!-- ============ TOAST ============ -->
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<!-- ============ BOTTOM NAV (mobile) ============ -->
<nav class="bottom-nav only-mobile" aria-label="ناڤیگەیشنی مۆبایل">
  <a href="#/home" data-nav="home">
    <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 11.5 12 5l8 6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10.5V19h12v-8.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    <span>سەرەتا</span>
  </a>
  <a href="#/movies" data-nav="movies">
    <svg viewBox="0 0 24 24" width="22" height="22"><rect x="3.5" y="4" width="17" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 4v3M16 4v3M4 10.5h16" stroke="currentColor" stroke-width="1.8"/></svg>
    <span>فیلمەکان</span>
  </a>
  <a href="#/finder" data-nav="finder" class="bottom-nav-cta">
    <svg viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="0.9" fill="currentColor"/></svg>
    <span>دۆزینەوە</span>
  </a>
  <a href="#/favorites" data-nav="favorites">
    <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 20s-7.2-4.5-9.6-9A5.4 5.4 0 0 1 12 6a5.4 5.4 0 0 1 9.6 5c-2.4 4.5-9.6 9-9.6 9Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    <span>دڵخوازەکان</span>
  </a>
  <a href="#/profile" data-nav="profile">
    <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="8.5" r="3.4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4.5 19.5c1.6-3.4 4.4-5 7.5-5s5.9 1.6 7.5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span>پرۆفایل</span>
  </a>
</nav>

<script src="script.js"></script>
</body>
      </html>
